<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — SkillSwap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="logo">
                <span class="logo-mark">S</span>
                <span>SkillSwap</span>
            </a>
        </div>
    </header>

    <main class="auth-shell">
        <div class="auth-card dash-card">

            <div class="dash-header">
                <div class="dash-avatar" id="avatarLetter">S</div>
                <div>
                    <h1>Welcome, <span id="userName">Student</span></h1>
                    <p>You're logged in to SkillSwap</p>
                </div>
            </div>

            <div class="dash-body">
                <div class="dash-info">
                    <div class="row"><span>Name</span><span id="profileName"></span></div>
                    <div class="row"><span>Email</span><span id="profileEmail"></span></div>
                </div>

                <p class="dash-note">
                    This is a placeholder dashboard. The next build step, per the project plan,
                    is a skill form (teach / learn) and the AI matching engine that turns your
                    profile into a ranked list of swap tickets like the one on the homepage.
                </p>

                <button class="auth-submit logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
